<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- Verbindungen schon beim Laden der Seite aufbauen (spart je 100–300 ms später) -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <title>Schematic Viewer</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <!-- Öffentliche Hülle: enthält NUR den Login. App-Code und App-Oberfläche sind verschlüsselt (js/payload.js). -->
  <div id="login">
    <form id="loginForm" autocomplete="off">
      <h1>▣ Schematic Viewer</h1>
      <p>Bitte Zugangsschlüssel eingeben</p>
      <input id="loginKey" type="password" placeholder="Schlüssel" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
      <label class="remember"><input type="checkbox" id="loginRemember" checked> Angemeldet bleiben</label>
      <button type="submit" id="loginBtn" class="primary">Entsperren</button>
      <div id="loginMsg" role="alert"></div>
      <noscript><div style="color:#ffb4b0">Für den Login wird JavaScript benötigt.</div></noscript>
    </form>
  </div>
  <div id="app"></div>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script defer src="js/payload.js"></script>
  <script defer src="js/login.js"></script>
</body>
</html>
